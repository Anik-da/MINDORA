<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self';">
  <title>MIKO · MINDORA</title>
  <link rel="stylesheet" href="./pet.css">
</head>
<body>
  <main class="pet-shell" id="pet-shell" data-state="idle" data-mode="compact">
    <div class="pet-glow" aria-hidden="true"></div>
    <span class="screen-observation-indicator" id="screen-observation-indicator" hidden>● Local screen awareness on</span>

    <button class="mascot-drag no-drag" id="mascot-button" type="button" aria-label="Open MINDORA. Drag to move, double-click for tasks.">
      <span class="state-halo" aria-hidden="true"></span>
      <span class="miko-art" id="companion-art" aria-hidden="true"><img src="./miko.png" alt=""></span>
      <span class="eye-lid eye-lid-left" aria-hidden="true"></span>
      <span class="eye-lid eye-lid-right" aria-hidden="true"></span>
      <span class="state-spark" aria-hidden="true"></span>
      <span class="state-effect" aria-hidden="true"></span>
    </button>

    <section class="context-bubble no-drag" aria-live="polite">
      <div class="bubble-heading">
        <strong id="state-label">Ready</strong>
        <span class="progress-chip" id="progress-chip">MINDORA</span>
      </div>
      <p id="task-message">Ready when you are.</p>
      <div class="bubble-actions" id="bubble-actions" hidden>
        <button type="button" id="session-action">Pause</button>
        <button type="button" id="stop-action">Stop</button>
        <button type="button" id="voice-action" hidden>Voice</button>
        <button type="button" id="suggestion-action" hidden>Continue</button>
        <button type="button" id="suggestion-dismiss" hidden aria-label="Dismiss suggestion">×</button>
        <button type="button" id="cancel-lock-action" hidden>Cancel lock</button>
      </div>
    </section>
    <nav class="pet-quick-actions no-drag" aria-label="Companion actions">
      <button type="button" id="pet-chat-button" aria-label="Chat with MINDORA" title="Chat with MINDORA"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14v9H9l-4 3v-3H3z"/></svg></button>
      <button type="button" id="pet-voice-button" aria-label="Start voice input" title="Start voice input"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v3m-3 0h6"/></svg></button>
      <button type="button" id="pet-stop-speaking" aria-label="Stop speaking and listening" title="Stop speaking or listening" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="2"/></svg></button>
    </nav>
    <section class="pet-chat no-drag" id="pet-chat" hidden aria-label="Ask MINDORA">
      <header><strong>Ask MINDORA</strong><button type="button" id="pet-chat-close" aria-label="Close chat">×</button></header>
      <div class="pet-chat-response" id="pet-chat-response" aria-live="polite">Ask a question or give MINDORA a task.</div>
      <form id="pet-chat-form"><textarea id="pet-chat-input" rows="2" maxlength="4000" placeholder="What can I help with?" required></textarea><button type="submit" id="pet-chat-send">Send</button></form>
      <label class="voice-mode"><input type="checkbox" id="pet-continuous-mode"> Continuous conversation</label>
    </section>
  </main>
  <script src="./pet.js"></script>
</body>
</html>
